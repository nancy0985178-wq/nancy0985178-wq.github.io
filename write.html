<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>寫文章</title>
<style>
  :root { --bg:#faf8f5; --fg:#2b2b2b; --muted:#8a8478; --line:#e6e1d8; --accent:#b5835a; --ok:#3d7a4a; --err:#b64040; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1c1a; --fg:#e8e4dc; --muted:#8f8a80; --line:#33312d; --accent:#d1a074; --ok:#7fc08c; --err:#e08a8a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 16px; }
  input[type=text], input[type=password], textarea {
    width:100%; font:inherit; color:inherit; background:transparent;
    border:1px solid var(--line); border-radius:12px; outline:none; padding:12px 14px; }
  input:focus, textarea:focus { border-color:var(--accent); }
  #title { font-size:20px; margin-bottom:12px; }
  #body { min-height:340px; font-size:17px; line-height:1.9; resize:vertical; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:var(--muted); font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border:none; border-radius:10px;
                   padding:10px 28px; font:inherit; font-size:16px; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .link { background:none; border:none; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; padding:0; text-decoration:underline; }
  #status { margin-top:16px; line-height:1.7; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  #tokenBox { display:none; border:1px dashed var(--line); border-radius:12px; padding:14px; margin-bottom:16px; }
  #tokenBox p { margin:0 0 10px; font-size:14px; color:var(--muted); line-height:1.7; }
  #tokenBox .row { display:flex; gap:8px; }
  #tokenBox button { white-space:nowrap; padding:8px 16px; border-radius:10px; border:1px solid var(--accent); background:none; color:var(--accent); cursor:pointer; font:inherit; }
  .foot { margin-top:28px; display:flex; gap:16px; font-size:13px; }
  .foot a { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ 寫一篇新文章</h1>

  <div id="tokenBox">
    <p>第一次使用，請貼上你的「發布鑰匙」（token）。它只會存在這台裝置的瀏覽器裡，不會傳給別人。</p>
    <div class="row">
      <input type="password" id="tokenInput" placeholder="github_pat_...">
      <button id="tokenSave">儲存</button>
    </div>
  </div>

  <input type="text" id="title" placeholder="標題">
  <textarea id="body" placeholder="想寫什麼都可以。換行會照你打的方式顯示。"></textarea>

  <div class="bar">
    <span id="count">0 字</span>
    <button class="primary" id="publish">發布</button>
  </div>

  <div id="status"></div>

  <div class="foot">
    <a href="./" >回到我的網站</a>
    <button class="link" id="tokenReset">更換發布鑰匙</button>
  </div>
</div>

<script>
  const OWNER = 'nancy0985178-wq';
  const REPO  = 'nancy0985178-wq.github.io';
  const $ = id => document.getElementById(id);
  const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
  const set = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
  const del = k => { try { localStorage.removeItem(k); } catch(e) {} };

  // 草稿自動儲存
  $('title').value = get('draft-title') || '';
  $('body').value  = get('draft-body')  || '';
  const updateCount = () => { $('count').textContent = $('body').value.replace(/\s/g,'').length + ' 字'; };
  updateCount();
  $('title').addEventListener('input', () => set('draft-title', $('title').value));
  $('body').addEventListener('input', () => { set('draft-body', $('body').value); updateCount(); });

  // 發布鑰匙
  const showToken = () => { $('tokenBox').style.display = 'block'; };
  if (!get('gh-token')) showToken();
  $('tokenSave').onclick = () => {
    const t = $('tokenInput').value.trim();
    if (!t) return;
    set('gh-token', t);
    $('tokenInput').value = '';
    $('tokenBox').style.display = 'none';
    say('鑰匙已儲存，可以開始發布了。', 'ok');
  };
  $('tokenReset').onclick = () => { del('gh-token'); showToken(); };

  function say(msg, cls) {
    const s = $('status');
    s.className = cls || '';
    s.textContent = msg;
  }

  const pad = n => String(n).padStart(2, '0');
  function toBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }

  $('publish').onclick = async () => {
    const title = $('title').value.trim();
    const text  = $('body').value.trim();
    const token = get('gh-token');
    if (!token) { showToken(); say('請先貼上發布鑰匙。', 'err'); return; }
    if (!title || !text) { say('標題和內容都要寫喔。', 'err'); return; }

    const now = new Date();
    const iso = now.toISOString();                       // 例：2026-10-20T09:21:00.000Z
    const fileName = iso.slice(0,10) + '-' + iso.slice(11,19).replace(/:/g,'') + '.md';
    const off = -now.getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    const abs = Math.abs(off);
    const localDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ` +
                      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ` +
                      `${sign}${pad(Math.floor(abs/60))}${pad(abs%60)}`;
    const safeTitle = title.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    // 單一換行也會顯示成換行
    const bodyText = text.replace(/([^\n])\n(?!\n)/g, '$1  \n');
    const content = `---\nlayout: post\ntitle: "${safeTitle}"\ndate: ${localDate}\n---\n\n${bodyText}\n`;

    $('publish').disabled = true;
    say('發布中…');
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/_posts/${fileName}`, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: '新文章：' + title, content: toBase64(content) })
      });
      if (res.ok) {
        del('draft-title'); del('draft-body');
        $('title').value = ''; $('body').value = ''; updateCount();
        say('✅ 已發布！網站約 1～2 分鐘後會出現這篇文章。', 'ok');
      } else if (res.status === 401) {
        say('鑰匙無效或已過期，請按下方「更換發布鑰匙」重新貼上。', 'err');
      } else if (res.status === 403 || res.status === 404) {
        say('這把鑰匙沒有權限寫入這個網站，請確認建立鑰匙時選對了 repository，且 Contents 設為 Read and write。', 'err');
      } else {
        say('發布失敗（代碼 ' + res.status + '），文章還留在這裡，稍後再試一次。', 'err');
      }
    } catch (e) {
      say('連線失敗，請檢查網路後再試。文章還留在這裡。', 'err');
    }
    $('publish').disabled = false;
  };
</script>
</body>
</html>
